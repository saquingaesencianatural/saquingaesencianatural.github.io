<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito | Esencia Natural</title>

    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link 
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header id="header"></header>

    <main class="container py-5">

        <h1 class="mb-4">
            Mi carrito de compras
        </h1>

        <div id="contenido-carrito">
            <!-- El carrito aparecerá con JavaScript -->
        </div>

    </main>

    <footer id="footer"></footer>

    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>

    <script>
        function mostrarCarrito() {

            const contenedor =
                document.getElementById("contenido-carrito");

            if (carrito.length === 0) {
                contenedor.innerHTML = `
                    <div class="alert alert-info">
                        Tu carrito está vacío.
                    </div>

                    <a href="productos.html"
                       class="btn btn-natural">
                        Ver productos
                    </a>
                `;

                return;
            }

            let total = 0;

            let contenido = `
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                                <th>Acción</th>
                            </tr>
                        </thead>

                        <tbody>
            `;

            carrito.forEach(function (producto, indice) {

                const subtotal =
                    producto.precio * producto.cantidad;

                total += subtotal;

                contenido += `
                    <tr>
                        <td>
                            ${producto.nombre}
                        </td>

                        <td>
                            $${producto.precio.toFixed(2)}
                        </td>

                        <td>
                            <button 
                                class="btn btn-sm btn-outline-secondary"
                                onclick="cambiarCantidad(${indice}, -1)">
                                −
                            </button>

                            <span class="mx-2">
                                ${producto.cantidad}
                            </span>

                            <button 
                                class="btn btn-sm btn-outline-secondary"
                                onclick="cambiarCantidad(${indice}, 1)">
                                +
                            </button>
                        </td>

                        <td>
                            $${subtotal.toFixed(2)}
                        </td>

                        <td>
                            <button 
                                class="btn btn-sm btn-outline-danger"
                                onclick="eliminarProducto(${indice})">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                `;
            });

            contenido += `
                        </tbody>
                    </table>
                </div>

                <div class="text-end mt-4">
                    <h3>
                        Total:
                        $${total.toFixed(2)}
                    </h3>

                    <button 
                        class="btn btn-success"
                        onclick="confirmarPedido(${total})">
                        Confirmar pedido por WhatsApp
                    </button>

                    <button 
                        class="btn btn-outline-danger"
                        onclick="vaciarCarrito()">
                        Vaciar carrito
                    </button>
                </div>
            `;

            contenedor.innerHTML = contenido;
        }

        function cambiarCantidad(indice, cantidad) {

            carrito[indice].cantidad += cantidad;

            if (carrito[indice].cantidad <= 0) {
                carrito.splice(indice, 1);
            }

            guardarCarrito();
            actualizarContador();
            mostrarCarrito();
        }

        function eliminarProducto(indice) {

            carrito.splice(indice, 1);

            guardarCarrito();
            actualizarContador();
            mostrarCarrito();
        }

        function vaciarCarrito() {

            carrito = [];

            guardarCarrito();
            actualizarContador();
            mostrarCarrito();
        }

        function confirmarPedido(total) {

            const productosPedido = carrito
                .map(producto =>
                    `${producto.nombre} x${producto.cantidad}`
                )
                .join(", ");

            const mensaje =
                `Hola, deseo realizar un pedido en Esencia Natural. ` +
                `Productos: ${productosPedido}. ` +
                `Total: $${total.toFixed(2)}`;

            const url =
                "https://wa.me/0967240718?text=" +
                encodeURIComponent(mensaje);

            window.open(url, "_blank");
        }

        document.addEventListener("DOMContentLoaded", function () {
            mostrarCarrito();
        });
    </script>

</body>

</html>
