<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta 
        name="description"
        content="Catálogo de productos de Saquinga Esencia Natural."
    >

    <title>Productos | Esencia Natural</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link 
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="productos-page">

    <!-- Barra de navegación creada por app.js -->
    <header id="header"></header>

    <main>

        <!-- Encabezado de productos -->
        <section class="productos-banner">

            <div class="container text-center">

                <i class="bi bi-bag-fill"></i>

                <h1>
                    Catálogo de productos
                </h1>

                <p>
                    Encuentra productos para cuidar tu piel,
                    cabello y bienestar.
                </p>

            </div>

        </section>

        <!-- Catálogo -->
        <section class="container py-5">

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">

                <div>
                    <span class="section-label">
                        ESENCIA NATURAL
                    </span>

                    <h2 class="mt-2">
                        Nuestros productos
                    </h2>
                </div>

                <select 
                    id="filtro"
                    class="form-select w-auto"
                >
                    <option value="Todos">
                        Todos los productos
                    </option>

                    <option value="Cuidado facial">
                        Cuidado facial
                    </option>

                    <option value="Higiene personal">
                        Higiene personal
                    </option>

                    <option value="Cuidado del cabello">
                        Cuidado del cabello
                    </option>

                    <option value="Perfumería">
                        Perfumería
                    </option>

                    <option value="Cuidado corporal">
                        Cuidado corporal
                    </option>
                </select>

            </div>

            <div 
                id="catalogo"
                class="row g-4"
            >
                <!-- Los productos aparecerán mediante JavaScript -->
            </div>

        </section>

    </main>

    <!-- Pie de página creado por app.js -->
    <footer id="footer"></footer>

    <!-- Bootstrap JavaScript -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Datos de productos -->
    <script src="js/datos.js"></script>

    <!-- Funciones principales -->
    <script src="js/app.js"></script>

    <!-- Mostrar productos y aplicar filtros -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const filtro = document.getElementById("filtro");

            if (
                typeof productos !== "undefined" &&
                typeof mostrarProductos === "function"
            ) {
                mostrarProductos(productos, "catalogo");
            }

            if (!filtro) {
                return;
            }

            filtro.addEventListener("change", function () {

                const categoriaSeleccionada = filtro.value;

                if (categoriaSeleccionada === "Todos") {

                    mostrarProductos(
                        productos,
                        "catalogo"
                    );

                } else {

                    const productosFiltrados = productos.filter(
                        producto =>
                            producto.categoria === categoriaSeleccionada
                    );

                    mostrarProductos(
                        productosFiltrados,
                        "catalogo"
                    );
                }

            });

        });
    </script>

</body>

</html>
