<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del producto | Esencia Natural</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link 
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- Menú de navegación -->
    <header id="header"></header>

    <!-- Contenido principal -->
    <main class="container py-5">

        <div id="detalle-producto">
            <!-- El producto aparecerá aquí mediante JavaScript -->
        </div>

    </main>

    <!-- Pie de página -->
    <footer id="footer"></footer>

    <!-- Bootstrap JavaScript -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Datos y funciones -->
    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>

    <!-- Código del detalle -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const parametros =
                new URLSearchParams(window.location.search);

            const idProducto =
                Number(parametros.get("id"));

            const producto =
                productos.find(
                    producto => producto.id === idProducto
                );

            const contenedor =
                document.getElementById("detalle-producto");

            if (!producto) {
                contenedor.innerHTML = `
                    <div class="text-center py-5">

                        <div class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            Producto no encontrado.
                        </div>

                        <a 
                            href="productos.html"
                            class="btn btn-natural">

                            <i class="bi bi-arrow-left"></i>
                            Regresar a productos

                        </a>

                    </div>
                `;

                return;
            }

            contenedor.innerHTML = `
                <div class="row g-5 align-items-center">

                    <div class="col-md-6">

                        <img 
                            src="${producto.imagen}"
                            alt="${producto.nombre}"
                            class="img-fluid rounded shadow"
                            onerror="this.src='https://placehold.co/800x600/e4f7ec/1f6f50?text=Esencia+Natural'">

                    </div>

                    <div class="col-md-6">

                        <span class="badge text-bg-success mb-3">
                            ${producto.categoria}
                        </span>

                        <h1>
                            ${producto.nombre}
                        </h1>

                        <p class="price">
                            $${producto.precio.toFixed(2)}
                        </p>

                        <p class="lead">
                            ${producto.descripcion}
                        </p>

                        <hr>

                        <h4>
                            <i class="bi bi-stars"></i>
                            Beneficios
                        </h4>

                        <p>
                            ${producto.beneficios}
                        </p>

                        <p>
                            <strong>
                                <i class="bi bi-box-seam"></i>
                                Stock disponible:
                            </strong>

                            ${producto.stock} unidades
                        </p>

                        <div class="d-flex gap-2 flex-wrap mt-4">

                            <button 
                                class="btn btn-natural"
                                onclick="agregarAlCarrito(${producto.id})">

                                <i class="bi bi-cart-plus-fill"></i>
                                Agregar al carrito

                            </button>

                            <a 
                                href="productos.html"
                                class="btn btn-outline-success">

                                <i class="bi bi-arrow-left"></i>
                                Regresar

                            </a>

                        </div>

                    </div>

                </div>
            `;
        });
    </script>

</body>

</html>
